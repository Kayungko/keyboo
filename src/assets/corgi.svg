<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="柯基伙伴">
  <!--
    Keyboo Companion Rig v1
    稳定动画节点：corgi-root / corgi-body / corgi-head / corgi-ear-left /
    corgi-ear-right / corgi-look / corgi-eye-left / corgi-eye-right /
    corgi-nose / corgi-mouth / corgi-tail / corgi-fur-* / corgi-paw-*
    AI 动画只应修改这些节点的 transform / opacity，不重写角色 Path。
    v3 形象：修正柯基识别度——超大立耳(约头高 75%,近垂直微外张)、
    狐狸脸(宽颊收窄下巴)、橙头+鼻梁细白纹(blaze)+白口鼻、W 微笑。
  -->
  <g id="corgi-root">
    <!-- 绒球尾在身体后方,单独成组供摇尾动画使用(柯基断尾绒球) -->
    <g id="corgi-tail" class="companion-tail">
      <circle cx="742" cy="700" r="58" fill="#E8902D"/>
      <circle cx="788" cy="656" r="40" fill="#E8902D"/>
      <circle cx="806" cy="628" r="22" fill="#FFF3DF"/>
    </g>

    <g id="corgi-body">
      <path id="corgi-fur-body" d="M512 588C622 588 700 640 706 744C710 848 634 900 512 900C390 900 314 848 318 744C324 640 402 588 512 588Z" fill="#F3A947"/>
      <ellipse id="corgi-fur-chest" cx="512" cy="796" rx="116" ry="96" fill="#FFF3DF"/>
    </g>

    <g id="corgi-paw-left">
      <path d="M445 812C478 812 492 836 490 860C488 886 468 894 445 894C422 894 402 886 400 860C398 836 412 812 445 812Z" fill="#FFF3DF"/>
      <path d="M431 872V888M459 872V888" stroke="#D7B89A" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="corgi-paw-right">
      <path d="M579 812C612 812 626 836 624 860C622 886 602 894 579 894C556 894 536 886 534 860C532 836 546 812 579 812Z" fill="#FFF3DF"/>
      <path d="M565 872V888M593 872V888" stroke="#D7B89A" stroke-width="6" stroke-linecap="round"/>
    </g>

    <g id="corgi-head">
      <!-- 超大立耳:近垂直微外张,耳基藏于头后 -->
      <g id="corgi-ear-left" class="companion-ear corgi-ear-left">
        <path d="M330 400C298 300 298 160 336 74C358 54 380 66 386 100C404 180 428 264 468 336C430 370 380 394 330 400Z" fill="#E8902D"/>
        <path d="M354 338C330 258 332 166 354 108C368 128 372 152 376 178C390 240 410 296 442 338C416 352 384 350 354 338Z" fill="#F6B2A1"/>
      </g>
      <g id="corgi-ear-right" class="companion-ear corgi-ear-right">
        <path d="M694 400C726 300 726 160 688 74C666 54 644 66 638 100C620 180 596 264 556 336C594 370 644 394 694 400Z" fill="#E8902D"/>
        <path d="M670 338C694 258 692 166 670 108C656 128 652 152 648 178C634 240 614 296 582 338C608 352 640 350 670 338Z" fill="#F6B2A1"/>
      </g>

      <!-- 狐狸脸:宽颊收窄下巴 -->
      <path id="corgi-fur-cheeks" d="M512 250C640 250 758 328 758 438C758 522 666 590 512 596C358 590 266 522 266 438C266 328 384 250 512 250Z" fill="#F3A947"/>

      <!-- 鼻梁细白纹(blaze):额头窄,向下接口鼻 -->
      <path d="M512 264C536 300 552 340 548 396C546 420 478 420 476 396C472 340 488 300 512 264Z" fill="#FFF3DF"/>

      <!-- 白口鼻:仅下颌区域 -->
      <path d="M512 418C594 418 654 456 656 510C658 562 592 594 512 596C432 594 366 562 368 510C370 456 430 418 512 418Z" fill="#FFF3DF"/>

      <!-- 腮红 -->
      <ellipse cx="340" cy="490" rx="36" ry="24" fill="#F7A3A0" opacity=".5"/>
      <ellipse cx="684" cy="490" rx="36" ry="24" fill="#F7A3A0" opacity=".5"/>

      <g id="corgi-look" class="companion-look">
        <g id="corgi-eye-left" class="companion-eye">
          <circle cx="378" cy="386" r="38" fill="#2B1A16"/>
          <circle cx="364" cy="372" r="10" fill="#FFFFFF"/>
          <circle cx="393" cy="401" r="5" fill="#FFFFFF" opacity=".7"/>
        </g>
        <g id="corgi-eye-right" class="companion-eye">
          <circle cx="646" cy="386" r="38" fill="#2B1A16"/>
          <circle cx="632" cy="372" r="10" fill="#FFFFFF"/>
          <circle cx="661" cy="401" r="5" fill="#FFFFFF" opacity=".7"/>
        </g>
      </g>

      <g id="corgi-nose" class="companion-nose">
        <path d="M512 442C534 442 550 456 550 472C550 486 534 492 512 492C490 492 474 486 474 472C474 456 490 442 512 442Z" fill="#2A201F"/>
        <ellipse cx="499" cy="458" rx="10" ry="6" fill="#FFFFFF" opacity=".35"/>
      </g>
      <!-- 柯基 W 微笑:人中+双侧上扬嘴角 -->
      <g id="corgi-mouth">
        <path d="M512 494V514" fill="none" stroke="#45251F" stroke-width="9" stroke-linecap="round"/>
        <path d="M512 514C512 536 488 544 468 532" fill="none" stroke="#45251F" stroke-width="9" stroke-linecap="round"/>
        <path d="M512 514C512 536 536 544 556 532" fill="none" stroke="#45251F" stroke-width="9" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
